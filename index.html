/* Pretendard type hierarchy */
:root{
  --font-sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --type-display:clamp(56px,8.5vw,128px);

  --type-section:clamp(24px,2.8vw,36px);

  --type-detail:14px;
  --type-label:12px;
}
html,body,button,input,table{font-family:var(--font-sans)}
body{font-size:var(--type-body);font-weight:400;line-height:1.6;letter-spacing:-.015em}

/* Image-led travel journal: cream paper, cobalt stage, loose photo arrangement. */
:root{--paper:#f5f4ee;--white:#fbfaf6;--ink:#252a20;--muted:#656b5b;--rule:#dedfd3;--blue:#587cdb;--blue-dark:#476bc7;--olive:#dfe5c9}
body{background:var(--paper)}
.site-head{border-bottom:1px solid var(--rule);background:rgba(245,244,238,.97)}
.brand{background:var(--ink);color:#f8f7ee;border-radius:5px;transform:rotate(-1deg)}
.brand span{color:#f8f7ee}
.nav button.active{background:var(--blue-dark);border-radius:6px;color:#f8f7ee}
.day-tabs{border:0;border-bottom:1px solid var(--rule);background:transparent;padding:0;gap:2px;border-radius:0}
.day-tabs button{border-radius:6px 6px 0 0}.day-tabs button.active{background:var(--blue-dark);color:#f8f7ee;border-radius:6px 6px 0 0}.day-tabs button.active small{color:#e8ecff}
.cover{min-height:0;background:var(--white);border:1px solid var(--rule);border-radius:12px;overflow:hidden;color:var(--ink)}
.cover-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:32px;padding:36px 40px 56px;min-height:190px;background:var(--white);border:0}
.cover-intro .kicker{font-size:12px;color:var(--blue-dark)}
.cover-intro p{max-width:410px;margin:4px 0 0;font-size:clamp(22px,3vw,36px);font-weight:760;line-height:1.18;letter-spacing:-.065em}
.cover-intro .issue{align-self:flex-end;white-space:nowrap;color:var(--muted)}
.blue-panel{position:relative;display:block;background:var(--blue);color:#fbfaf6;padding:10px 34px 50px;min-height:460px;overflow:hidden}
.blue-panel::before{content:'';position:absolute;z-index:0;top:-10px;left:-1%;width:104%;height:26px;background:var(--white);clip-path:polygon(0 0,100% 0,100% 30%,94% 14%,87% 60%,79% 20%,72% 52%,64% 10%,55% 40%,46% 16%,37% 58%,28% 19%,20% 45%,11% 16%,0 52%)}
.blue-panel::after{content:'';position:absolute;right:8%;top:21%;width:52px;height:52px;background:#e5e7d0;clip-path:polygon(48% 0,54% 39%,85% 15%,61% 46%,100% 51%,61% 56%,84% 88%,54% 62%,48% 100%,44% 61%,13% 88%,38% 56%,0 51%,39% 46%,14% 16%,44% 39%);transform:rotate(14deg);opacity:.82}
.blue-panel h1{position:relative;z-index:1;max-width:1030px;margin:0 auto;color:#fbfaf6;font-size:clamp(72px,10.9vw,152px);line-height:.93;font-weight:790;letter-spacing:-.095em;text-align:left;white-space:nowrap}
.cover-lede{position:relative;z-index:1;max-width:1030px;margin:12px auto 18px;color:#edf0fc;text-align:left;font-size:15px;font-weight:600}
.collage{position:relative;z-index:2;max-width:860px;width:86%;margin:-6px auto 0;display:grid;grid-template-columns:1.15fr .9fr 1fr;gap:18px;align-items:start}
.polaroid,.polaroid:nth-child(n){margin:0;padding:8px 8px 22px;background:#fbfaf6;border:0;border-radius:3px;box-shadow:0 14px 28px rgba(22,38,65,.13);overflow:visible}
.polaroid:nth-child(1){transform:rotate(-7deg) translateY(12px)}.polaroid:nth-child(2){transform:rotate(4deg) translateY(32px)}.polaroid:nth-child(3){transform:rotate(-4deg) translateY(7px)}
.polaroid:first-child .photo,.polaroid:not(:first-child) .photo{aspect-ratio:1.05;filter:grayscale(.75) contrast(.92)}
.cover-bottom{background:var(--white);padding:14px 32px;border:0;justify-content:flex-end}
.jump{background:var(--olive);color:var(--ink);border:0;border-radius:6px;padding:10px 16px;font-weight:700}
.jump:hover{background:#cfd7b2;color:var(--ink)}
#app{margin-top:88px}.section-head{padding:0 0 16px;border-bottom:1px solid var(--rule);margin-bottom:28px}.section-head h2{font-size:clamp(40px,5.8vw,72px);letter-spacing:-.078em}
.day-layout{gap:36px}.day-banner{background:#e8ecd9;border:1px solid var(--rule);border-radius:12px 12px 5px 12px;padding:24px 28px}.day-banner h3{font-size:38px}
.note{background:#e9edda;border:1px solid var(--rule);border-radius:5px 12px 5px 12px}
.timeline{border:0;gap:8px}.stop,.stop--static,.route,.event{background:#fbfaf6;border:1px solid var(--rule);border-radius:10px;padding:0;margin:0;box-shadow:none}
.stop:hover,.route:hover,.event:hover{background:#fffef9}
.stop summary,.stop--static .stop-row{padding:18px 20px;gap:12px}.stop h4{font-size:17px}.stop time,.event small{color:var(--blue-dark)}

.route-jump{background:var(--blue-dark);border-radius:6px}.route-jump:hover{background:#3457b0}
.tag,.status,.detail span,.section-head .count{background:#e8eccf;color:#394434;border-radius:999px}
.map-layout,.map-side,.pin-form,.overview-scroll{border-radius:10px;overflow:hidden}.search{border-radius:6px}
.overview-scroll{border-color:var(--rule)}.overview-scroll thead th,.overview-scroll thead th:first-child{background:var(--blue-dark)}
#trip-note{margin:80px 0 56px}

const esc = value => String(value ?? '').replace(/[&<>"']/g, char =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const tabs = () => `<div class="day-tabs" role="group" aria-label="여행 날짜">${DATA.days.map((date, index) => {

}).join('')}</div>`;
const heading = (title, subtitle = '', extra = '') => `<div class="section-head${extra.startsWith('<input') ? ' with-search' : ''}"><div><h2>${title}</h2>${subtitle ? `<p>${subtitle}</p>` : ''}</div>${extra}</div>`;

function renderSchedule(date) {
  const alert = date.day.startsWith('12/13')
    ? '<p class="note day-alert"><strong>16:00 셔틀 환승</strong> · 요나고역 15:45 이전 도착을 목표로 잡아두세요. <a href="#trip-note">출발 전 확인 ↓</a></p>' : '';
  return `${heading('날짜별 일정')}
    <div class="day-layout">
      <aside class="day-side">
        <div class="day-banner"><div><h3>${esc(date.day)}</h3></div></div>
        ${alert}
        ${renderMap()}
      </aside>
      <div class="timeline">${date.slots.map((slot, index) => {
         const routeIndex = routeBySlot[day][index];
         const route = routeIndex === undefined ? null : DATA.routes.filter(item => item.day === date.day)[routeIndex];
         const label = /후보|확인|선택|미정/.test(slot.title) && !slot.detail ? '<span class="tag">확인 필요</span>' : '';
         if (slot.shops) return `<details class="stop" name="schedule-route"><summary><time>${esc(slot.time)}</time><h4>${esc(slot.title)}</h4><span class="stop-toggle" aria-hidden="true"></span></summary><div class="shop-list">${slot.shops.map(shop => `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.query)}" target="_blank" rel="noopener noreferrer"><span>${esc(shop.name)}</span><small>Google 지도 ↗</small></a>`).join('')}</div>${renderFact(slot)}</details>`;
         if (!route && !slot.detail) return `<article class="stop stop--static"><div class="stop-row"><time>${esc(slot.time)}</time><h4>${esc(slot.title)}</h4>${label}</div></article>`;
         if (!route) return `<details class="stop" name="schedule-route"><summary><time>${esc(slot.time)}</time><h4>${esc(slot.title)}</h4><span class="stop-toggle" aria-hidden="true"></span></summary>${renderFact(slot)}</details>`;
         const transport = day === 0 && index === 2 ? renderAirportTransfer() : `<div class="stop-route"><strong>${esc(route.from)} → ${esc(route.to)}</strong><p>${esc(route.how)}</p>${route.duration ? `<span class="stop-duration">${esc(route.duration)}</span>` : ''}${route.note ? `<p class="stop-route-note">${esc(route.note)}</p>` : ''}${/^https:\/\//.test(route.link) ? `<a href="${esc(route.link)}" target="_blank" rel="noopener noreferrer">공식 안내 열기 ↗</a>` : ''}</div>`;
         return `<details class="stop" name="schedule-route"><summary><time>${esc(slot.time)}</time><h4>${esc(slot.title)}</h4>${label}<span class="stop-toggle" aria-hidden="true"></span></summary>${transport}${renderFact(slot)}</details>`;
       }).join('')}</div>
    </div>`;
}

function renderFact(slot){return slot.detail ? `<div class="slot-fact"><p>${esc(slot.detail)}</p>${slot.source ? `<a href="${esc(slot.source)}" target="_blank" rel="noopener noreferrer">공식 안내 ↗</a>` : ''}</div>` : '';}

          <div class="pin-actions"><button type="submit">핀 저장</button><button type="button" id="pin-cancel">취소</button></div>
        </form>
        <h3>이날의 핀 <span id="pin-count">0</span></h3>
        <div id="pin-list" class="pin-list"></div>
        <p id="map-status" class="map-status" role="status"></p>
      </div>
    </div>`;
}
function mapStatus(message) {
  const element = document.getElementById('map-status');
  if (element) element.textContent = message;
}
async function loadSharedPins() {
  if (!cloudMode) return;
  try {
    const response = await fetch('/api/pins', {headers:{'x-trip-key':tripKey}, cache:'no-store'});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '핀을 불러오지 못했습니다.');
    pins = data.pins;
    refreshPins();
    mapStatus('');
  } catch (error) { mapStatus(error.message); }
}
async function savePin(pin) {
  if (!cloudMode) {
    pins.push({id:String(Date.now()) + '-' + Math.random().toString(36).slice(2), ...pin});
    try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch (_) { mapStatus('이 브라우저에서는 핀을 저장할 수 없습니다.'); }
    refreshPins();
    return true;
  }
  try {
    const response = await fetch('/api/pins', {method:'POST', headers:{'Content-Type':'application/json','x-trip-key':tripKey}, body:JSON.stringify(pin)});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '핀을 저장하지 못했습니다.');
    pins.push(data.pin);
    refreshPins();
    mapStatus('핀이 공유되었습니다.');
    return true;
  } catch (error) { mapStatus(error.message); return false; }
}
async function deletePin(id) {
  if (cloudMode) {
    try {
      const response = await fetch('/api/pins?id=' + encodeURIComponent(id), {method:'DELETE', headers:{'x-trip-key':tripKey}});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '핀을 삭제하지 못했습니다.');
    } catch (error) { mapStatus(error.message); return; }
  }
  pins = pins.filter(item => item.id !== id);
  if (!cloudMode) try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch (_) {}
  refreshPins();
}
function refreshPins() {
  if (!mapInstance || !pinLayer) return;
  pinLayer.clearLayers();
  plannedPlaces.filter(place => place.day === day).forEach(place => {
    L.circleMarker([place.lat,place.lng], {radius:7,color:'#252b28',weight:2,fillColor:'#f4f3ee',fillOpacity:1}).addTo(pinLayer).bindPopup(`<strong>${esc(place.name)}</strong>`);
  });
  const dayPins = pins.filter(pin => pin.day === day);
  dayPins.forEach(pin => {
    const marker = L.circleMarker([pin.lat, pin.lng], {radius:8, color:'#244fb6', weight:2, fillColor:'#5f82d8', fillOpacity:1}).addTo(pinLayer);
    marker.bindPopup(`<strong>${esc(pin.name)}</strong><br>${esc(DATA.days[pin.day]?.day || '')}`);
  });
  document.getElementById('pin-count').textContent = String(dayPins.length);
  document.getElementById('pin-list').innerHTML = dayPins.length ? dayPins.map(pin => `<div class="pin-row"><button type="button" class="pin-focus" data-pin="${esc(pin.id)}"><strong>${esc(pin.name)}</strong></button><button type="button" class="pin-delete" data-delete="${esc(pin.id)}" aria-label="${esc(pin.name)} 핀 삭제">삭제</button></div>`).join('') : '<p class="pin-empty">아직 저장한 핀이 없습니다.</p>';
  document.querySelectorAll('[data-pin]').forEach(button => button.onclick = () => {
    const pin = pins.find(item => item.id === button.dataset.pin);
    if (pin) { mapInstance.setView([pin.lat, pin.lng], 14); }
  });
  document.querySelectorAll('[data-delete]').forEach(button => button.onclick = () => deletePin(button.dataset.delete));
}
function initMap() {
  if (typeof L === 'undefined') {
    document.getElementById('map-status').textContent = '지도를 불러오지 못했습니다. 인터넷 연결을 확인하세요.';
    return;
  }
  const centers = [[35.4333,133.3333],[35.4333,133.3333],[35.367,132.755],[35.505,133.238],[35.4333,133.3333]];
  mapInstance = L.map('trip-map', {scrollWheelZoom:false}).setView(centers[day], 11);
  const tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:19,
    attribution:'Sources: Esri, HERE, Garmin, USGS, Intermap, © OpenStreetMap contributors, GIS User Community'
  }).addTo(mapInstance);
  let tileErrorShown = false;
  tiles.on('tileerror', () => {
    if (tileErrorShown) return;
    tileErrorShown = true;
    document.getElementById('map-status').textContent = '지도 배경을 불러오지 못했습니다. 인터넷 연결을 확인하세요.';
  });
  pinLayer = L.layerGroup().addTo(mapInstance);
  mapInstance.on('click', event => {
    pendingPoint = event.latlng;
    const form = document.getElementById('pin-form');
    form.hidden = false;
    document.getElementById('pin-name').focus();
  });
  document.getElementById('pin-cancel').onclick = () => {
    pendingPoint = null;
    document.getElementById('pin-form').hidden = true;
  };
  document.getElementById('pin-form').onsubmit = async event => {
    event.preventDefault();
    if (!pendingPoint) return;
    const name = document.getElementById('pin-name').value.trim();
    if (!name) return;
    const submit = event.target.querySelector('[type="submit"]');
    submit.disabled = true;
    const saved = await savePin({name, day, lat:pendingPoint.lat, lng:pendingPoint.lng});
    submit.disabled = false;
    if (saved) { pendingPoint = null; event.target.reset(); event.target.hidden = true; }
  };
  refreshPins();
  if (cloudMode) {
    document.getElementById('share-link').onclick = async () => {
      const url = location.href.split('#')[0] + '#trip=' + tripKey;
      try { await navigator.clipboard.writeText(url); mapStatus('공유 링크를 복사했습니다. 링크를 가진 사람은 핀을 수정할 수 있습니다.'); }
      catch (_) { mapStatus('링크를 복사하지 못했습니다: ' + url); }
    };
    document.getElementById('pin-reload').onclick = loadSharedPins;
    loadSharedPins();
  }
  const dayPins = pins.filter(pin => pin.day === day);
  const visiblePoints = [...plannedPlaces.filter(place => place.day === day), ...dayPins];
  if (visiblePoints.length) mapInstance.fitBounds(visiblePoints.map(point => [point.lat,point.lng]), {padding:[24,24],maxZoom:14});
  setTimeout(() => mapInstance?.invalidateSize(), 0);
}

function render() {
  if (mapInstance) { mapInstance.remove(); mapInstance = null; pinLayer = null; }
  const date = DATA.days[day];
  menu.forEach(button => {
    const active = button.dataset.view === view;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
  });

  if (view === 'schedule') {
    app.innerHTML = renderSchedule(date);
    initMap();
  } else if (view === 'events') {
    app.innerHTML = renderEvents();
  } else {
    app.innerHTML = renderOverview();
  }

  dates.hidden = view !== 'schedule';
  dates.innerHTML = dates.hidden ? '' : tabs();
  dates.querySelectorAll('[data-day]').forEach(button => {
    button.onclick = () => {
      day = Number(button.dataset.day);
      render();
      dates.querySelector(`[data-day="${day}"]`).focus({preventScroll:true});
      app.scrollIntoView({block:'start'});
    };
  });
}

function openView(next) {
  view = next;
  render();
  app.focus({preventScroll:true});
  app.scrollIntoView({block:'start'});
}
document.querySelector('.jump').onclick = event => {
  event.preventDefault();
  openView('schedule');
};
menu.forEach(button => { button.onclick = () => openView(button.dataset.view); });
render();
</script></body></html>
